name: Build APK

# Daily Report LKA. Isi di repo GitHub -> Settings -> Secrets and variables -> Actions:
#   Variables : SUPABASE_URL, SUPABASE_ANON_KEY (wajib)
#   Secrets   : SUPABASE_SECRET_KEY (update di dalam aplikasi)
#
# Pesan commit:
#   [tes] -> update otomatis HANYA untuk akun MT (latest_mt.json)
#   tanpa [tes] -> Trainer & Sales (latest_sm.json)
#   [pc]  -> juga dikirim ke semua PC (latest.json)

on:
  push:
    branches: [main, uji]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: gradle-${{ runner.os }}-v1-${{ github.run_id }}
          restore-keys: gradle-${{ runner.os }}-v1-

      # Keystore khusus LKA (beda dengan NKA, jadi kedua aplikasi bisa terpasang berdampingan).
      # Build pertama membuatnya lalu menyimpannya ke repo; build berikutnya memakai file yang sama
      # agar update APK bisa di-install di atas versi lama.
      - name: Pasang keystore (tanda tangan APK tetap sama tiap build)
        run: |
          mkdir -p ~/.android
          if [ ! -f ci/debug.keystore ]; then
            echo "Keystore belum ada, membuat keystore baru untuk Daily Report LKA"
            keytool -genkeypair -v -keystore ci/debug.keystore -storepass android -alias androiddebugkey \
              -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Daily Report LKA, O=OPPO Big Sampit, C=ID"
            git config user.name ci
            git config user.email ci@users.noreply.github.com
            git add ci/debug.keystore
            git commit -m "CI: keystore Daily Report LKA [skip ci]"
            git push
          fi
          cp ci/debug.keystore ~/.android/debug.keystore

      - name: Siapkan folder Android
        run: |
          flutter --version | tee ci-log.txt
          flutter create --org com.oppobigsampit --project-name daily_report_lka --platforms=android . 2>&1 | tail -5
          rm -rf test
          python3 ci/patch_android.py

      - name: Ambil dependency
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee -a ci-log.txt

      - name: Analisa kode
        id: analyze
        continue-on-error: true
        run: |
          set -o pipefail
          echo "===== ANALYZE =====" >> ci-log.txt
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee -a ci-log.txt

      - name: Build APK
        id: build
        env:
          SB_URL: ${{ vars.SUPABASE_URL }}
          SB_ANON: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          set -o pipefail
          echo "===== BUILD =====" >> ci-log.txt
          clean() { printf '%s' "$1" | tr -d '[:space:]"'"'"; }
          SB_URL="$(clean "$SB_URL" | sed -E 's:/rest/v1/?$::; s:/+$::')"; SB_ANON="$(clean "$SB_ANON")"
          echo "Supabase: url=$SB_URL anon_key=${#SB_ANON}" | tee -a ci-log.txt
          DEFINES=(--dart-define="BUILD_NUMBER=${{ github.run_number }}"
                   --dart-define="UPDATE_CHANNEL=${{ github.ref == 'refs/heads/main' && 'rilis' || 'uji' }}")
          if [ -n "$SB_URL" ]; then DEFINES+=(--dart-define="SUPABASE_URL=$SB_URL" --dart-define="SUPABASE_ANON_KEY=$SB_ANON"); fi
          build() {
            flutter build apk --release --target-platform android-arm64 \
              --build-name="1.0.${{ github.run_number }}" \
              --build-number="${{ github.run_number }}" \
              "${DEFINES[@]}" \
              2>&1 | tee build-full.txt
          }
          ok=0
          for i in 1 2 3 4; do
            if build; then ok=1; break; fi
            if ! grep -qiE '50[0-9]|timed? ?out|downloading artifacts|Could not (GET|download|resolve)' build-full.txt; then break; fi
            echo "Percobaan build $i gagal karena jaringan, ulangi..." | tee -a ci-log.txt
            sleep $((i * 60))
          done
          tail -n 60 build-full.txt >> ci-log.txt
          [ "$ok" = 1 ]

      - name: Cek tanda tangan APK
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | tee apk-cert.txt
          cat apk-cert.txt >> ci-log.txt
          grep -q "CN=Daily Report LKA" apk-cert.txt || { echo "APK TIDAK memakai keystore LKA" | tee -a ci-log.txt; exit 1; }

      - name: Simpan log build gagal
        if: failure()
        run: |
          if [ -f build-full.txt ]; then
            grep -nE "error|Error|ERROR|FAILURE|What went wrong|Exception" build-full.txt | head -n 150 >> ci-log.txt || true
            tail -n 120 build-full.txt >> ci-log.txt
          fi

      - name: Kirim log ke branch ci-logs
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          cp ci-log.txt "$RUNNER_TEMP/logs/ci-log.txt"
          cd "$RUNNER_TEMP/logs"
          echo "run ${{ github.run_number }} | commit ${{ github.sha }} | analyze=${{ steps.analyze.outcome }} build=${{ steps.build.outcome }}" > status.txt
          git init -q
          git checkout -q -b ci-logs
          git add .
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "log run ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-logs

      - name: Siapkan file APK
        run: cp build/app/outputs/flutter-apk/app-release.apk "DailyReportLKA-v1.0.${{ github.run_number }}.apk"

      - name: Simpan APK uji coba (artifact)
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: DailyReportLKA-v1.0.${{ github.run_number }}-uji
          path: DailyReportLKA-v1.0.${{ github.run_number }}.apk

      # Update di dalam aplikasi: unggah APK + latest*.json ke bucket publik "apk" di Supabase,
      # lalu hapus APK lama (hanya 5 terbaru per saluran yang disimpan).
      - name: Unggah APK untuk update di aplikasi (Supabase)
        env:
          SB_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SB_URL: ${{ vars.SUPABASE_URL }}
          CH: ${{ github.ref == 'refs/heads/main' && 'rilis' || 'uji' }}
          N: ${{ github.run_number }}
          # Repo GitHub PUBLIK khusus APK + token (fine-grained, Contents: read & write ke repo itu)
          APK_TOKEN: ${{ secrets.APK_REPO_TOKEN }}
          APK_REPO: ${{ vars.APK_REPO || 'svanikha/daily-report-lka-apk' }}
        run: |
          if [ -z "$SB_KEY" ] || [ -z "$SB_URL" ]; then echo "SUPABASE_SECRET_KEY / SUPABASE_URL belum diisi, langkah ini dilewati"; exit 0; fi
          SB_KEY="$(printf '%s' "$SB_KEY" | tr -d '[:space:]')"
          SB_URL="$(printf '%s' "$SB_URL" | tr -d '[:space:]"' | sed -E 's:/rest/v1/?$::; s:/+$::')"
          F="DailyReportLKA-v1.0.$N.apk"
          BASE="$SB_URL/storage/v1/object"
          AUTH=(-H "apikey: $SB_KEY")
          case "$SB_KEY" in eyJ*) AUTH+=(-H "Authorization: Bearer $SB_KEY");; esac
          ls -lh "$F" | tee -a ci-log.txt
          # APK diunduh dari GitHub Releases repo publik (tidak memakai kuota egress Supabase).
          # Hanya jika token belum ada / gagal, APK disimpan di Supabase sebagai cadangan.
          URL=""
          APK_TOKEN="$(printf '%s' "$APK_TOKEN" | tr -d '[:space:]')"
          if [ -n "$APK_TOKEN" ] && [ -n "$APK_REPO" ]; then
            TAG="v1.0.$N"
            PRE=true; git log -1 --format=%B | grep -qi '\[pc\]' && PRE=false
            REL="$(curl -sS -X POST "https://api.github.com/repos/$APK_REPO/releases" \
              -H "Authorization: Bearer $APK_TOKEN" -H "Accept: application/vnd.github+json" \
              -d "$(jq -n --arg t "$TAG" --argjson p $PRE --arg b "$(git log -1 --format=%s)" \
                    '{tag_name: $t, name: ("Daily Report LKA " + $t), body: $b, prerelease: $p, make_latest: (if $p then "false" else "true" end)}')")"
            RID="$(printf '%s' "$REL" | jq -r '.id // empty')"
            if [ -n "$RID" ] && curl -sS --fail -X POST \
                 "https://uploads.github.com/repos/$APK_REPO/releases/$RID/assets?name=$F" \
                 -H "Authorization: Bearer $APK_TOKEN" -H "Content-Type: application/vnd.android.package-archive" \
                 --data-binary @"$F" > /dev/null; then
              URL="https://github.com/$APK_REPO/releases/download/$TAG/$F"
              echo "APK diunggah ke GitHub Releases: $URL" | tee -a ci-log.txt
            else
              echo "Gagal unggah ke GitHub Releases, pakai Supabase: $(printf '%s' "$REL" | jq -r '.message // empty')" | tee -a ci-log.txt
            fi
          else
            echo "APK_REPO_TOKEN belum diisi: APK disimpan di Supabase (memakan kuota egress)" | tee -a ci-log.txt
          fi
          if [ -z "$URL" ]; then
            curl -sS --fail-with-body -X POST "$BASE/apk/$CH/$F" "${AUTH[@]}" \
              -H "x-upsert: true" -H "Content-Type: application/vnd.android.package-archive" \
              --data-binary @"$F"
            URL="$SB_URL/storage/v1/object/public/apk/$CH/$F"
          fi
          # File penunjuk versi (sekitar 200 byte) tetap di Supabase
          jq -n --argjson code "$N" --arg name "1.0.$N" --arg url "$URL" \
            '{version_code: $code, version_name: $name, url: $url, catatan: ""}' > latest.json
          cat latest.json
          up() {
            curl -sS --fail-with-body -X POST "$BASE/apk/$CH/$1" "${AUTH[@]}" \
              -H "x-upsert: true" -H "cache-control: max-age=60" -H "Content-Type: application/json" \
              --data-binary @latest.json
          }
          if git log -1 --format=%B | grep -qi '\[tes\]'; then
            up latest_mt.json
            echo "Mode TES: update hanya untuk akun MT." | tee -a ci-log.txt
          else
            up latest_sm.json
            if git log -1 --format=%B | grep -qi '\[pc\]'; then
              up latest.json
              echo "Update dikirim ke Trainer, Sales, dan semua PC ([pc])" | tee -a ci-log.txt
            else
              echo "Update hanya untuk MT, Trainer, Sales" | tee -a ci-log.txt
            fi
          fi
          # Hapus APK lama: simpan 5 terbaru di folder saluran ini
          LIST="$(curl -sS -X POST "$SB_URL/storage/v1/object/list/apk" "${AUTH[@]}" -H "Content-Type: application/json" \
            -d "{\"prefix\":\"$CH/\",\"limit\":1000,\"sortBy\":{\"column\":\"created_at\",\"order\":\"desc\"}}")"
          OLD="$(printf '%s' "$LIST" | jq -r '[.[] | select(.name | endswith(".apk"))] | .[5:] | map("'"$CH"'/" + .name) | @json' 2>/dev/null || echo '[]')"
          if [ -n "$OLD" ] && [ "$OLD" != "[]" ] && [ "$OLD" != "null" ]; then
            echo "Hapus APK lama: $OLD" | tee -a ci-log.txt
            curl -sS -X DELETE "$SB_URL/storage/v1/object/apk" "${AUTH[@]}" -H "Content-Type: application/json" \
              -d "{\"prefixes\":$OLD}" || true
          fi

      - name: Upload APK ke Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Daily Report LKA v1.0.${{ github.run_number }}
          body: |
            APK Daily Report LKA build ${{ github.run_number }}.
            Download file .apk di bawah lalu install di HP Android.
          files: DailyReportLKA-v1.0.${{ github.run_number }}.apk
          make_latest: true
